[project]
name = "personal-mcp-servicenow"
version = "4.4.0"
description = "MCP server for ServiceNow (incidents, changes, KB, SLA, CMDB)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.1",
    "starlette>=0.40.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "orjson>=3.9.0",
    "httpx>=0.28.1",
    "httpcore>=1.0.9",
    "h11>=0.16.0",
    "python-dotenv>=1.0.0",
    "fastmcp>=3.3.0",
    "anyio>=4.0.0",
    "structlog>=24.1.0",
    "zipp>=3.19.1",
    "python-multipart>=0.0.18",
    "certifi>=2024.7.4",
    "jinja2>=3.1.6",
    "pygments>=2.15.0",
    "requests>=2.32.4",
    "tqdm>=4.66.3",
    "urllib3>=2.5.0",
]

[tool.coverage.run]
source = ["."]
omit = [
    "Testing/*",
    "tests/*",
    "scripts/*",
    "*/__pycache__/*",
    "*/test_*",
    "venv/*",
    ".venv/*",
    "env/*",
    ".env/*"
]
branch = true
relative_files = true

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:"
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--disable-warnings",
    "--tb=short",
]
markers = [
    "integration: marks tests as integration tests (may require external resources)",
    "unit: marks tests as unit tests",
    "asyncio: marks tests as async tests",
]