[project]
name = "personal-mcp-servicenow"
version = "5.0.2"
description = "MCP server for ServiceNow (incidents, changes, KB, SLA, CMDB)"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.3.0,<4",
    "httpx>=0.28.1",
    "pydantic>=2.0.0",
    "structlog>=24.1.0",
    "anyio>=4.0.0",
    "python-dotenv>=1.0.0",
]

[tool.coverage.run]
source = ["."]
omit = [
    "Testing/*",
    "tests/*",
    "scripts/*",
    "*/__pycache__/*",
    "*/test_*",
    "venv/*",
    ".venv/*",
    "env/*",
    ".env/*"
]
branch = true
relative_files = true

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:"
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--disable-warnings",
    "--tb=short",
]
markers = [
    "integration: marks tests as integration tests (may require external resources)",
    "unit: marks tests as unit tests",
    "asyncio: marks tests as async tests",
]
[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.23.0",
    "coverage[toml]>=7.0.0",
    "tiktoken>=0.7.0",
]
